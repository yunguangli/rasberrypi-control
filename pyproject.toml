[project]
name = "picontrol"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.3"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.3",
    "flet-desktop>=1.0.3",
    "flet-web>=1.0.3",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.3",
    # Pi-side GPIO. Only needed on the PC for `pi.py --dev` (mock pins) and
    # the dispatcher tests; the Pi installs gpiozero on its own (apt/pip).
    # The Pi target is 1.6.2 (RPi.GPIO backend, Python 3.11): the code and the
    # tests are version-agnostic, so the suite passes on 2.x here and on 1.6.2
    # there — see AGENTS.md for the separate 3.11/1.6.2 test run.
    "gpiozero>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.mycompany"
product = "picontrol"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"
